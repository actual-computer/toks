# The release artifacts of linux x86-64 and arm64 from a clean runner: tools/release.sh (make test first, then the C
# bundle and the CPython 3.10-3.14 wheels) with the pinned toolchain test.yml uses, uploaded as run artifacts. The
# release machines (docs/machines.md) remain the first source; this is the reproduction from a clean install, and the
# fallback when a release machine is out. Dispatched by hand at a release commit.
name: release-artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: blacksmith-4vcpu-ubuntu-2404
          - name: linux-arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: llvm 21.1.8 (cache)
        id: llvm
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ~/.cache/toks-llvm/21.1.8
          key: llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci/llvm.sh') }}
      - name: llvm 21.1.8
        run: tools/ci/llvm.sh && echo "$HOME/.cache/toks-llvm/21.1.8/bin" >> "$GITHUB_PATH"
      - name: tokenizers (key)
        id: tokkey
        run: echo "key=tokenizers-v1-${{ runner.os }}-$(python3 tools/ci/fetch_tokenizers.py --key)" >> "$GITHUB_OUTPUT"
      - name: tokenizers (cache)
        id: tok
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            ~/.cache/toks/tokenizers
            ~/.cache/toks/kimik3
          key: ${{ steps.tokkey.outputs.key }}
      - name: tokenizers
        run: mkdir -p build/ci && python3 tools/ci/fetch_tokenizers.py | tee build/ci/fetch.log
      - name: uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: release.sh (make test, bundle, wheels)
        run: TOKS_COMMIT=${{ github.sha }} sh tools/release.sh 2>&1 | tee build/ci/release.log
      - name: artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-${{ matrix.name }}
          path: |
            build/release/toks-*.tar.gz
            build/release/toks-*/MANIFEST
            build/wheels/toks-*.whl
            build/ci/release.log
          if-no-files-found: error
