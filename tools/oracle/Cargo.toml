[package]
name = "tiktoken-pieces"
version = "0.1.0"
edition = "2021"
publish = false
description = "piece oracle: tiktoken's regex split (fancy-regex find_iter), the crate versions inside the tiktoken 0.14.0 wheels"

# The versions the tiktoken 0.14.0 wheels were built with, read from the panic-location paths inside the
# wheels' .so files (macosx_11_0_arm64, manylinux_2_28_aarch64, manylinux_2_28_x86_64, cp312 -- identical):
# fancy-regex-0.19.0, regex-automata-0.4.18, regex-syntax-0.8.11, aho-corasick-1.1.5, memchr-2.8.3.
# tiktoken ships no Cargo.lock (neither the sdist nor the repo tag), so the wheel is the only record.
# Cargo.lock pins the transitive ones; README.md says how it was made.
[dependencies]
fancy-regex = "=0.19.0"
regex-automata = "=0.4.18"
regex-syntax = "=0.8.11"

[profile.release]
opt-level = 3
debug = false
